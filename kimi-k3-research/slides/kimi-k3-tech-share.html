<h2 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E6%8A%8A%E5%BA%95%E5%BA%A7%E6%8E%A8%E5%88%B0-3t-%E7%BA%A7">为什么把底座推到 3T 级？</h2>
<ul>
<li>LLM scaling 有 <strong>两条轴</strong>：
<ul>
<li><strong>轴一 · 预训练规模</strong>：更大模型 + 更多数据</li>
<li><strong>轴二 · test-time compute</strong>：RL + 推理 effort + 长程交互</li>
</ul>
</li>
<li>现状：开源在 <strong>轴二</strong> 猛进（推理 / agentic RL），但 <strong>轴一停在 1T 级</strong> 附近</li>
<li>风险：都在相似规模底座上堆 RL → 开源 <strong>互相收敛</strong>，与闭源前沿 <strong>差距扩大</strong></li>
<li><strong>K3 的选择：两轴同时推到前沿</strong> —— 底座到 3T 级，同时把 RL / effort / 交互推到 <strong>1M 上下文</strong></li>
</ul>
<blockquote>
<p>结果：2.8T 总参 / 104B 激活 / 1M 上下文，整体 scaling 效率相比 K2 <strong>≈ 2.5×</strong></p>
</blockquote>

<h2 id="%E5%BA%8F%E5%88%97%E7%BB%B4hybrid-attention--3%C3%97kda--1%C3%97mla">序列维：Hybrid Attention = 3×KDA + 1×MLA</h2>
<ul>
<li>每个 block：<strong>3 层 KDA（线性注意力）+ 1 层 Gated MLA（全局注意力）</strong>，全网重复；末尾补 1 层 MLA → <strong>最后一层一定是全局注意力</strong></li>
<li><strong>为什么混合？</strong>
<ul>
<li>KDA 承担 <strong>绝大多数 token mixing</strong>：固定大小递归状态，长序列便宜</li>
<li>线性注意力的 <strong>软肋 = 长程精确召回</strong> → 用 <strong>1/4 的全局 MLA</strong> 兜底</li>
<li>3:1 = &quot;效率 vs 召回&quot; 的工程折中（继承自 Kimi Linear）</li>
</ul>
</li>
<li>好处直接体现在 1M 上下文：<strong>KV cache 大幅下降、解码吞吐大幅提升</strong></li>
</ul>
<blockquote>
<p>DeepSeek-V3 = 全 MLA；Qwen3 = GQA。K3 用&quot;线性为主 + 全局兜底&quot;换长上下文效率。</p>
</blockquote>
</section>

<h2 id="kda-%E6%BC%94%E8%BF%9B-%E2%91%A0%E7%BB%99%E8%A1%B0%E5%87%8F%E9%97%A8%E5%8A%A0%E4%B8%8B%E7%95%8C-%E2%86%92-%E7%B3%BB%E7%BB%9F%E5%A4%A7%E6%94%B6%E7%9B%8A">KDA 演进 ①：给衰减门&quot;加下界&quot; → 系统大收益</h2>
<ul>
<li><strong>问题</strong>：chunkwise 里要用累计衰减的<strong>倒数</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi mathvariant="normal">Γ</mi></mrow><annotation encoding="application/x-tex">1/\Gamma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/Γ</span></span></span></span> 重标定 key；<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Γ</mi></mrow><annotation encoding="application/x-tex">\Gamma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Γ</span></span></span></span> 是一堆 (0,1) 连乘 → 倒数<strong>无界</strong>、BF16 下溢出</li>
<li>Kimi Linear 的对角 tile 只能用 <strong>逐位置对 (position-pair)</strong> 计算 → <strong>上不了 Tensor Core</strong>，成 intra-chunk 瓶颈</li>
<li><strong>K3 改法</strong>：把 log-decay 从&quot;无界负 Softplus&quot;换成 <strong>带下界的缩放 sigmoid</strong></li>
</ul>

<h2 id="kda-%E6%BC%94%E8%BF%9B-%E2%91%A1%E5%85%A8%E7%A7%A9%E8%BE%93%E5%87%BA%E9%97%A8">KDA 演进 ②：全秩输出门</h2>

 style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">g</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊙</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord"><span class="mord mathrm">RMSNorm</span></span><span class="mopen">(</span><span class="mord"><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">o</span></span><span style="top:-3.35em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.1944em;"><span class="mord">~</span></span></span></span></span></span></span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord"><span class="delimsizing size1">]</span></span></span></span></span></span></p><ul>

<h2 id="gated-mla--nope%E5%85%A8%E5%B1%80%E5%B1%82%E4%B8%BA%E4%BB%80%E4%B9%88%E4%B8%8D%E5%8A%A0%E4%BD%8D%E7%BD%AE%E7%BC%96%E7%A0%81">Gated MLA + NoPE：全局层为什么不加位置编码</h2>
<ul>
<li><strong>MLA</strong>（源自 DeepSeek-V2）：把每 token 的 KV 压成低维 latent <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>c</mi><mi>t</mi></msub><mo>=</mo><msub><mi>W</mi><mi>c</mi></msub><msub><mi>x</mi><mi>t</mi></msub></mrow><annotation encoding="application/x-tex">c_t=W_c x_t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">c</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">c</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 缓存，用时上投影重建 → KV cache 大幅缩小，保留全局注意力</li>
<li><strong>改动 1 · NoPE</strong>：所有 MLA 层 <strong>不加任何显式位置编码</strong>
<ul>
<li>位置信息由中间的 <strong>KDA 层通过递归门控/衰减隐式提供</strong>；MLA 只做&quot;无约束全局内容交互&quot;</li>
<li>副产品：<strong>扩上下文零改动</strong> —— 不用重调 RoPE base、不用 YaRN 插值 → 直接外推 1M</li>
</ul>
</li>
<li><strong>改动 2 · 全秩输出门</strong>：与 KDA 一致</li>
<li>数值工程：训练时注意力输出保 <strong>FP32</strong> 纠正 flash-attn 有偏 rounding，并重设计 kernel 用其与 KV staging 重叠</li>
</ul>
</section>

<p><strong>洞见：标准残差 = 深度维的 RNN。</strong></p>
<p>展开 PreNorm：<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>h</mi><mi>l</mi></msub><mo>=</mo><msub><mi>h</mi><mn>1</mn></msub><mo>+</mo><msub><mo>∑</mo><mrow><mi>i</mi><mo>&lt;</mo><mi>l</mi></mrow></msub><msub><mi>f</mi><mi>i</mi></msub><mo stretchy="false">(</mo><msub><mi>h</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">h_l = h_1 + \sum_{i&lt;l} f_i(h_i)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0771em;vertical-align:-0.3271em;"></span><span class="mop"><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1864em;"><span style="top:-2.4003em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">i</span><span class="mrel mtight">&lt;</span><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3271em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> —— <strong>每层用固定单位权重把所有前层加起来</strong></p>
<ul>
<li>三个后果：
<ol>
<li><strong>无选择性访问</strong>：attention 层和 MLP 层拿到同一个聚合态</li>
<li><strong>不可逆损失</strong>：早层信息被埋，深层无法选择性找回（实测可裁掉不少层）</li>
<li><strong>输出膨胀</strong>：PreNorm 下 hidden 幅度随深度 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>L</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(L)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">L</span><span class="mclose">)</span></span></span></span> 增长，稀释每层贡献、破坏稳定</li>
</ol>
</li>
</ul>
<blockquote>
<p>类比：序列维当年用 attention 取代 RNN 递归 —— <strong>深度维也该如此</strong>。</p>
</blockquote>

<h2 id="attention-residuals%E6%B7%B1%E5%BA%A6%E7%BB%B4-softmax-%E6%B3%A8%E6%84%8F%E5%8A%9B">Attention Residuals：深度维 softmax 注意力</h2>
<p>每层 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>l</mi></mrow><annotation encoding="application/x-tex">l</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span></span></span></span> 用一个 <strong>可学伪 query</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>w</mi><mi>l</mi></msub></mrow><annotation encoding="application/x-tex">w_l</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0197em;">l</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>，对&quot;embedding + 所有前层输出&quot;做 softmax 注意力：</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>ϕ</mi><mo stretchy="false">(</mo><mi>q</mi><mo separator="true">,</mo><mi>k</mi><mo stretchy="false">)</mo><mo>=</mo><mi>exp</mi><mo>⁡</mo><mtext> ⁣</mtext><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msup><mi>q</mi><mi mathvariant="normal">⊤</mi></msup><mrow><mi mathvariant="normal">R</mi><mi mathvariant="normal">M</mi><mi mathvariant="normal">S</mi><mi mathvariant="normal">N</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">m</mi></mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>α</mi><mrow><mi>i</mi><mo>→</mo><mi>l</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>ϕ</mi><mo stretchy="false">(</mo><msub><mi>w</mi><mi>l</mi></msub><mo separator="true">,</mo><msub><mi>k</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><mrow><munder><mo>∑</mo><mi>j</mi></munder><mi>ϕ</mi><mo stretchy="false">(</mo><msub><mi>w</mi><mi>l</mi></msub><mo separator="true">,</mo><msub><mi>k</mi><mi>j</mi></msub><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>h</mi><mi>l</mi></msub><mo>=</mo><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>l</mi><mo>−</mo><mn>1</mn></mrow></munderover><msub><mi>α</mi><mrow><mi>i</mi><mo>→</mo><mi>l</mi></mrow></msub><mtext> </mtext><msub><mi>v</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">\phi(q,k)=\exp\!\big(q^{\top}\mathrm{RMSNorm}(k)\big),\qquad \alpha_{i\to l}=\frac{\phi(w_l,k_i)}{\sum_j \phi(w_l,k_j)},\qquad h_l=\sum_{i=0}^{l-1}\alpha_{i\to l}\,v_i

<h2 id="%E6%9E%81%E7%AB%AF%E7%A8%80%E7%96%8F%E6%94%BE%E5%A4%A7%E4%B8%A4%E4%B8%AA%E5%A4%B1%E6%95%88%E6%A8%A1%E5%BC%8F-%E2%86%92-%E4%B8%89%E6%8B%9B%E6%B2%BB">极端稀疏放大两个失效模式 → 三招治</h2>
<p><strong>896 专家把 vanilla 设计的两个问题放大：</strong></p>
<ol>
<li>routed 分支近似 <strong>4 连乘矩阵</strong>（<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>W</mi><mo>↓</mo></msub><mo>⋅</mo></mrow><annotation encoding="application/x-tex">W_\downarrow\cdot</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mrel mtight">↓</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mord">⋅</span></span></span></span>gated-FFN<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⋅</mo><msub><mi>W</mi><mo>↑</mo></msub></mrow><annotation encoding="application/x-tex">\cdot W_\uparrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord">⋅</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mrel mtight">↑</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span>）→ 病态、<strong>内部激活爆炸</strong></li>
<li>近 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mn>3</mn></msup></mrow><annotation encoding="application/x-tex">10^3</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span></span></span></span></span></span></span></span> 专家的<strong>负载均衡</strong>超出现有 aux-loss-free bias 更新能稳住的范围</li>
</ol>
<p><strong>Stable LatentMoE 的三招：</strong></p>
<table>
<thead>
<tr>
<th>招</th>
<th>治什么</th>
<th>做法</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Normalized LatentMoE</strong></td>
<td>尺度敏感</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>u</mi></mrow><annotation encoding="application/x-tex">u</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">u</span></span></span></span> 与 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>W</mi><mo>↑</mo></msub></mrow><annotation encoding="application/x-tex">W_\uparrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mrel mtight">↑</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> 之间插 <strong>RMSNorm</strong>；顺带改善验证 loss</td>
</tr>
<tr>
<td><strong>SiTU-GLU</strong></td>
<td>激活爆炸</td>
<td>对 Swish 线性因子 + up 分支各套 <strong>softcap</strong></td>
</tr>
<tr>
<td><strong>Quantile Balancing</strong></td>
<td>大规模均衡</td>
<td>bias 设为 margin 分布的<strong>分位数</strong></td>
</tr>

<h2 id="situ-glu%E6%9C%89%E7%95%8C%E5%8F%88%E4%BF%9D%E7%95%99-swiglu-%E7%9A%84%E5%BD%A2%E7%8A%B6">SiTU-GLU：有界又保留 SwiGLU 的形状</h2>

<li><strong>背景</strong>：SwiGLU 两个乘子（<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mi>σ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">x\sigma(x)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">x</span><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mclose">)</span></span></span></span> 和 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span>）<strong>都无界</strong> → 大坐标产生激活离群点、低精度易溢出</li>

<h2 id="quantile-balancing%E4%BB%8E%E7%AC%A6%E5%8F%B7%E6%AD%A5%E9%95%BF%E5%88%B0%E5%88%86%E4%BD%8D%E6%95%B0">Quantile Balancing：从&quot;符号步长&quot;到&quot;分位数&quot;</h2>
<ul>
<li><strong>背景</strong>：aux-loss-free 路由给 router 分数加<strong>专家偏置 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>b</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">b_j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9805em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></strong> 影响 Top-k，但 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>b</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">b_j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9805em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> <strong>不进</strong> softmax 权重（不改混合、不干扰 router 梯度）</li>
<li>DeepSeek-V3：<strong>固定步长符号</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>b</mi><mi>j</mi></msub><mtext> ⁣</mtext><mo>←</mo><mtext> ⁣</mtext><msub><mi>b</mi><mi>j</mi></msub><mo>+</mo><mi>γ</mi><mtext> </mtext><mrow><mi mathvariant="normal">s</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">g</mi><mi mathvariant="normal">n</mi></mrow><mo stretchy="false">(</mo><mtext>负载误差</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">b_j\!\leftarrow\! b_j+\gamma\,\mathrm{sign}(\text{负载误差})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9805em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:-0.1667em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">←</span><span class="mspace" style="margin-right:-0.1667em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.9805em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0556em;">γ</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathrm">sign</span></span><span class="mopen">(</span><span class="mord text"><span class="mord cjk_fallback">负载误差</span></span><span class="mclose">)</span></span></span></span> → <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0556em;">γ</span></span></span></span> 大震荡 / 小收敛慢；896 专家更难稳</li>
<li><strong>QB 洞见</strong>：把均衡看作<strong>最优平衡指派</strong>（每专家恰收 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi><mo>=</mo><mi>m</mi><mi>k</mi><mi mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">q=mk/n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">mk</span><span class="mord">/</span><span class="mord mathnormal">n</span></span></span></span>）→ 线性松驰 + 对偶 → 专家侧对偶变量的<strong>闭式解 = margin 分布的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>k</mi><mi mathvariant="normal">/</mi><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1-k/n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord">/</span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span> 分位数</strong></li>
</ul>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msubsup><mover accent="true"><mi>b</mi><mo>^</mo></mover><mi>j</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></msubsup><mo>=</mo><mo>−</mo><mtext> </mtext><msub><mrow><mi mathvariant="normal">q</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">t</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">e</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>k</mi><mi mathvariant="normal">/</mi><mi>n</mi></mrow></msub><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>s</mi><mrow><mo>:</mo><mo separator="true">,</mo><mi>j</mi></mrow></msub><mo>−</mo><msup><mi>α</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo separator="true">,</mo><mspace width="2em"/><msup><mi>b</mi><mrow><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mover accent="true"><mi>b</mi><mo>^</mo></mover><mo>−</mo><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">e</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi></mrow><mo stretchy="false">(</mo><mover accent="true"><mi>b</mi><mo>^</mo></mover><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\hat b_j^{(t+1)}=-\,\mathrm{quantile}_{1-k/n}\big(s_{:,j}-\alpha^{(t)}\big),\qquad b^{(t+1)}=\hat b-\mathrm{mean}(\hat b)

<h2 id="qb-%E5%B7%A5%E7%A8%8B%E8%90%BD%E5%9C%B0%E7%9B%B4%E6%96%B9%E5%9B%BE%E5%85%A8%E5%B1%80%E4%BC%B0%E8%AE%A1">QB 工程落地：直方图全局估计</h2>
<ul>
<li>全局 batch 的 margin 有<strong>数百万</strong>、分散在各 rank/累积步 → 精确分位数不可行</li>
<li>每专家维护一个<strong>直方图</strong>（对 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>r</mi><mrow><mi>i</mi><mo separator="true">,</mo><mi>j</mi></mrow></msub><mo>=</mo><msub><mi>α</mi><mi>i</mi></msub><mo>−</mo><msub><mi>s</mi><mrow><mi>i</mi><mo separator="true">,</mo><mi>j</mi></mrow></msub></mrow><annotation encoding="application/x-tex">r_{i,j}=\alpha_i-s_{i,j}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">i</span><span class="mpunct mtight">,</span><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0037em;">α</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0037em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">i</span><span class="mpunct mtight">,</span><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> 分箱）</li>
<li>一次 <strong>all-reduce 求和 bin 计数</strong> → 从池化计数恢复分位数</li>
<li>counts 可加 → <strong>与 token 如何分片无关</strong> → 得到的是<strong>全局</strong> batch 的分位数</li>
<li>通信量仅每层每步 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>×</mo><mi>B</mi></mrow><annotation encoding="application/x-tex">n\times B</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span></span></span></span> 个整数（<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi><mo>≈</mo><mn>1000</mn></mrow><annotation encoding="application/x-tex">B\approx1000</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1000</span></span></span></span>，误差 ~几×<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow><annotation encoding="application/x-tex">10^{-3}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">3</span></span></span></span></span></span></span></span></span></span></span></span>）；可再对分位数做 EMA 降噪</li>
</ul>
<blockquote>
<p>负载均衡从&quot;启发式步长&quot;升级为&quot;有理论最优解 + 可扩展估计&quot;。</p>
</blockquote>

<h2 id="native-vision--per-head-muon%E9%80%9F%E8%A7%88">Native Vision + Per-Head Muon（速览）</h2>
<div class="cols">
<div class="col">
<h3 id="%E5%8E%9F%E7%94%9F%E5%A4%9A%E6%A8%A1%E6%80%81">原生多模态</h3>
<ul>
<li>文本/图/视频 <strong>同一 backbone、同一 context、单一 next-token 目标</strong></li>
<li><strong>MoonViT-V2（401M）从零训练</strong>，不再用 SigLIP 初始化
<ul>
<li>理由是<strong>稳定性</strong>：SigLIP-init 梯度范数持续偏高+尖峰</li>
<li>性能打平 → 大规模 MLLM <strong>不必</strong>依赖对比预训练</li>
</ul>
</li>
</ul>
</div>
<div class="col">
<h3 id="per-head-muon">Per-Head Muon</h3>
<ul>
<li>Muon = 动量 + Newton–Schulz 正交化</li>
<li><strong>改动</strong>：Q/K/V 投影 <strong>按 head 切块、逐 head 正交化</strong></li>
<li><strong>为什么</strong>：整矩阵正交化下，大尺度 head 主导共享更新方向 → 逐 head <strong>均衡各 head 更新尺度</strong></li>
<li>顺带：高瘦块 Newton–Schulz 更便宜</li>
</ul>
</div>
</div>
</section>

<h2 id="%E5%AF%B9%E6%AF%94%E5%B0%8F%E7%BB%93k3-%E7%9A%84%E5%8F%96%E8%88%8D%E4%B8%8E%E4%BC%98%E5%8A%A3">对比小结：K3 的取舍与优劣</h2>
<ul>
<li><strong>一句话</strong>：K3 = <strong>把 DeepSeek 系地基（MLA + shared/routed MoE + aux-loss-free）</strong> 上，叠 <strong>KDA（线性注意力）+ AttnRes（深度维）+ LatentMoE（宽度稀疏）+ Per-Head Muon + QAT</strong>，把<strong>规模与上下文同时推到 3T / 1M</strong></li>
</ul>
<div class="cols">
<div class="col">
<p><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 优势</strong></p>
<ul>
<li>1M 上下文 KV/算力显著更省（KDA + NoPE）</li>
<li>稀疏度 ~56、专家特化空间大 → scaling 效率高</li>
<li>低精度更稳、部署成本低（SiTU-GLU + QAT）</li>
<li>均衡无超参、几步收敛（QB）</li>
</ul>
</div>
<div class="col">
<p><strong><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 代价</strong></p>
<ul>
<li><strong>结构 + 系统复杂度显著上升</strong></li>
<li>线性注意力长程召回靠 1/4 MLA 兜底</li>
<li>极端稀疏需一整套稳定化 + MoonEP</li>
<li>→ 所以必须配套 FlashKDA / KCP / MoonEP / 显存管理</li>
</ul>
<p><strong>Qwen3</strong> 走保守稳健路线：工程简单，但 scaling/长上下文上限更受限。</p>

<h2 id="scaling-law25%C3%97-%E4%B8%8E%E4%B8%80%E6%9D%A1%E6%96%B9%E6%B3%95%E8%AE%BA">Scaling Law：2.5× 与一条方法论</h2>
<ul>
<li>结构/数据/训练一起改 → 最优训练 regime 也变 → 专门重调 <strong>batch size / lr / TPP / 模型 shape</strong></li>
<li>结论：整体 <strong>scaling 效率 ≈ 2.5×</strong>（held-out OOD 验证）</li>
<li><strong>cosine decay 一致优于 WSD</strong>，但关键在方法论 <img class="emoji" draggable="false" alt="👇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f447.svg" data-marp-twemoji=""/></li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>两种调度的最优超参差别很大</strong> —— 用同一套超参比较会不公平地偏袒其中一个。<br />
<strong>正确做法：各自独立做 scaling-law 搜索，在各自最优下再比。</strong> 结论才是 cosine 最终 loss 更低。</p>
</blockquote>
<ul>
<li>对我们的启示：<strong>比较任何训练技巧，都要&quot;各自调到最优再比&quot;。</strong></li>
</ul>
</section>

<h2 id="%E8%AE%AD%E7%BB%83%E9%85%8D%E6%96%B9">训练配方</h2>
<ul>
<li><strong>原生多模态</strong>：语言与视觉 <strong>从训练一开始就联合优化</strong>，视觉/文本 token 交织进单一 next-token 目标</li>
<li>优化器：<strong>Per-Head Muon</strong> + K2 的 <strong>weight-clipping</strong></li>
<li>MoE 均衡：<strong>Quantile Balancing</strong></li>
<li>调度：<strong>cosine lr + 1% 线性 warmup</strong>；<strong>weight decay = 0.1</strong> 全程</li>
<li>上下文课程起步：<strong>8K → 64K</strong>（预训练期）</li>
</ul>
</section>

<h2 id="%E9%95%BF%E4%B8%8A%E4%B8%8B%E6%96%87%E6%89%A9%E5%B1%95%E5%88%B0-1m">长上下文扩展到 1M</h2>
<ul>
<li><strong>位置</strong>：NoPE → <strong>直接外推 1M</strong>，无需任何位置编码改动（不 rescale RoPE、不 YaRN）</li>
<li><strong>数据</strong>：长文/长视频含大量低质（近重复 / 二进制块 / 截断 / 无效日志）→ 专门清洗（精确+模糊去重、视频帧感知哈希、结构校验）
<ul>
<li>天然长文稀缺 → <strong>上采样</strong></li>
<li><strong>长度 ≠ 长程能力</strong> → 合成&quot;必须跨全 1M 才能解&quot;的任务（排列拼接多模态文档/子任务），把注意力<strong>训练在目标尺度</strong>，防退化成局部模式</li>
</ul>
</li>
<li><strong>渐进式四阶段课程</strong>：
<ul>
<li>预训练期 <strong>8K → 64K</strong>；cooldown 期 <strong>256K → 1M</strong></li>
<li>把昂贵的长序列计算<strong>集中在训练预算的一小部分</strong> → 经济且渐进适应</li>
</ul>
</li>
</ul>

<h2 id="%E9%83%A8%E7%BD%B2%E6%84%9F%E7%9F%A5%E9%87%8F%E5%8C%96qat">部署感知量化（QAT）</h2>
<ul>
<li>MoE 专家权重（参数显存大头）→ <strong>MXFP4</strong>，激活 → <strong>MXFP8</strong></li>
<li>非专家部分（注意力投影 / latent MoE 投影 / shared 专家 / router）<strong>保持高精度</strong></li>
<li><strong>从 SFT 起全程 QAT</strong>（覆盖 SFT + RL）→ 模型适应量化精度损失</li>
<li><strong>RL 时 rollout 与训练用同一量化方案</strong> → <strong>消除 train-infer 失配</strong></li>
</ul>
<blockquote>
<p>为什么能训得动 MXFP4：SiTU-GLU 有界 + 各处 RMSNorm + KDA 门下界，都是低精度的稳定器。</p>
</blockquote>
</section>

<h2 id="%E4%B8%89%E5%A4%A7%E7%B3%BB%E7%BB%9F%E6%8C%91%E6%88%98%E5%90%8C%E5%A4%84%E4%B8%80%E6%A8%A1%E5%9E%8B--%E5%B9%B6%E8%A1%8C%E7%BB%84%E5%90%88">三大系统挑战同处一模型 + 并行组合</h2>
<p><strong>K3 罕见地在同一模型叠了三种系统级挑战：</strong></p>
<ul>
<li>混合 <strong>KDA</strong> 注意力（串行递归 vs GPU 宽并行）</li>
<li><strong>3T 级稀疏多模态</strong> 训练/推理</li>
<li><strong>百万 token agentic</strong> 负载</li>
</ul>
<p><strong>并行组合</strong>：PP（+虚拟阶段 VP）+ <strong>EP</strong> + ZeRO-1 DP + <strong>Pipeline ZeRO-2 梯度分片</strong> + <strong>CP（KCP）</strong></p>
<p><strong>多模态 3T 预训练的三个核心难题 → 逐一解决：</strong></p>
<ol>
<li>token 负载在 EP rank 间不均 → <strong>MoonEP</strong></li>
<li>激活/梯度/优化器状态超显存预算 → <strong>统一激活管理 / ZeRO-2 / remote-offload</strong></li>
<li>ViT 可变计算暴露在关键路径 → <strong>bubble filling</strong></li>
</ol>
</section>

<h2 id="kda-%E5%8D%8F%E5%90%8C-%E2%91%A0flashkda--intra-device-cp">KDA 协同 ①：FlashKDA + intra-device CP</h2>
<p>KDA 用固定大小递归状态换掉增长的 KV cache —— 好处是状态小易复用，坏处是<strong>串行更新</strong>与 GPU 宽并行冲突，<strong>每个执行阶段是不同瓶颈</strong>。</p>
<ul>
<li><strong>FlashKDA（训练 &amp; prefill）</strong>：chunkwise &quot;块内并行、块间串行&quot;，朴素实现串行传播时 SM 空转
<ul>
<li>CUTLASS kernel，把<strong>块内计算与跨块状态传播 overlap</strong>；拆成 token-parallel 阶段 + head-parallel 递归，各自调优</li>
<li>配合 §KDA 的&quot;下界化衰减&quot;让对角块也上 Tensor Core；作为 flash-linear-attention 自动派发后端</li>
</ul>
</li>
<li><strong>intra-device Context Parallelism（长上下文 prefill）</strong>：纯 TP 只切 head 不缩短递归 → 超长 prefill 时 SM 空转
<ul>
<li>洞见：<strong>每段状态转移可独立于入态先算、之后精确合成</strong></li>
<li>SM 级 CP planner 把序列切到单 rank 各 SM 并行 → <strong>完全 intra-device、零跨设备通信</strong></li>
</ul>
</li>
</ul>
</section>

<h2 id="kda-%E5%8D%8F%E5%90%8C-%E2%91%A1kcp-%E8%B7%A8%E8%AE%BE%E5%A4%87%E4%B8%8A%E4%B8%8B%E6%96%87%E5%B9%B6%E8%A1%8C">KDA 协同 ②：KCP 跨设备上下文并行</h2>

<h2 id="moonep%E4%B8%BA%E4%BB%80%E4%B9%88%E9%9C%80%E8%A6%81%E5%AE%8C%E7%BE%8E%E8%B4%9F%E8%BD%BD%E5%9D%87%E8%A1%A1">MoonEP：为什么需要&quot;完美负载均衡&quot;</h2>
<p><strong>常规 EP（如 DeepEP）的痛点：</strong></p>
<ul>
<li>token 负载在 rank 间<strong>不均</strong> → 计算不均<strong>拖慢吞吐</strong>（最热 rank 决定延迟）</li>
<li>routed 激活是<strong>动态 shape</strong> → 显存<strong>碎片化</strong>、每层要 <strong>host-device 同步</strong>取真实 shape → 流水停顿、高不均时 <strong>OOM</strong></li>
</ul>
<p><strong>MoonEP 的目标</strong>：让<strong>每个 rank 恰好收 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>×</mo><mi>K</mi></mrow><annotation encoding="application/x-tex">S\times K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span> 个 token</strong>（S=每 rank token 数、K=top-k）</p>
<p>→ 一旦&quot;完美均衡&quot;，就能连锁拿到：<strong>静态 shape + 零拷贝 + 免 host 同步 + 不 OOM</strong>。</p>
</section>

<h2 id="moonep%E5%AE%8C%E7%BE%8E%E5%9D%87%E8%A1%A1--er-%E4%B8%8A%E7%95%8C%E8%AF%81%E6%98%8E">MoonEP：完美均衡 + E/R 上界证明</h2>
<p><strong>核心问题</strong>：要多少&quot;冗余专家&quot;才能保证总能均衡？</p>
<blockquote>
<p><strong>定理（附录 E）</strong>：每 rank 至多 <strong><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mi mathvariant="normal">/</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">E/R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span></strong> 个冗余专家就一定存在均衡方案，且此界基本紧。<br />
（<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi></mrow><annotation encoding="application/x-tex">E</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span></span></span></span>=专家数，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span>=EP size）</p>
</blockquote>
<p><strong>构造性证明思路</strong>：</p>
<ul>
<li>反复&quot;用一个过载 rank 去填满一个欠载 rank，直到恰好 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>×</mo><mi>K</mi></mrow><annotation encoding="application/x-tex">S\times K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span>&quot;</li>
<li>每次填满<strong>一个</strong> rank 且之后不再变 → 至多 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">R-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> 次；每 rank 至多被<strong>一个</strong> rank 填</li>
<li>→ 某 rank 的远程 token 来自<strong>单一</strong> rank 的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>≤</mo><mi>E</mi><mi mathvariant="normal">/</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">\le E/R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7719em;vertical-align:-0.136em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> 个本地专家 ∎</li>
</ul>
<p><strong>意义</strong>：每 rank 预留 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mi mathvariant="normal">/</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">E/R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> 冗余槽 → 规划<strong>总有可行解、训练永不中断</strong><br />
（对比 ECHO/UltraEP：预设冗余数或 per-rank cap，无解时被迫停训、还要手调 cap）</p>
</section>

<h2 id="moonep%E5%9C%A8%E7%BA%BF%E8%A7%84%E5%88%92--%E9%9B%B6%E6%8B%B7%E8%B4%9D--%E9%9D%99%E6%80%81-shape">MoonEP：在线规划 · 零拷贝 · 静态 shape</h2>
<ul>
<li><strong>在线规划</strong>：每步精确 ILP 太贵 → 离线 ILP 求参照，设计 <strong>GPU 规划 kernel</strong>（近最优、开销可忽略、始终满足 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mi mathvariant="normal">/</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">E/R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">/</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> 上界）
<ul>
<li>前向从当前 router 输出规划冗余专家并<strong>预取</strong>；反向把其梯度 stage 到本地 reduce buffer，算完 reduce 回 home rank</li>
</ul>
</li>
<li><strong>零拷贝通信</strong>：融合 permute/unpermute —— token <strong>直接发到远程 rank 的专家分组位置</strong>，通信 buffer 的<strong>视图直接交给计算</strong>
<ul>
<li>完美均衡下 buffer 只需固定 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>×</mo><mi>K</mi></mrow><annotation encoding="application/x-tex">S\times K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span>（DeepEP 最坏要 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>×</mo><mi>K</mi><mo>×</mo><mi>R</mi></mrow><annotation encoding="application/x-tex">S\times K\times R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span>）</li>
</ul>
</li>
<li><strong>静态 shape + sync-free</strong>：完美均衡 → MoE 计算 shape <strong>静态已知</strong> → <strong>消除每层 MoE host 同步</strong>、降 kernel 启动开销</li>
<li><strong>Expert-GEMM 调度</strong>：rank 内每专家 token 数仍偏斜 → <strong>workload-aware 调度器</strong>（分析型代价模型 + 离线 autotune）；shared 专家 GEMM 派单独 stream overlap</li>
</ul>
</section>

<h2 id="%E6%98%BE%E5%AD%98%E9%AB%98%E6%95%88%E8%AE%AD%E7%BB%83-%E2%91%A0">显存高效训练 ①</h2>
<ul>
<li><strong>统一激活管理器</strong>：每个为反向保存的 tensor 绑一个<strong>可插拔存储后端</strong>
<ul>
<li>重计算 / 量化 / offload / remote-offload 都只是&quot;存储策略&quot;，可在 tensor 粒度自由组合，用注解声明、与模型代码解耦</li>
<li>单一内存池（避免多流碎片）；激活按层预取 + 与计算 overlap</li>
<li>K3 多数激活用 <strong>block-wise FP8 + offload</strong>，逐元素算子配重计算</li>
</ul>
</li>
<li><strong>Memory-efficient MoE</strong>（借鉴 SonicMoE）：把 permuted probs 梯度<strong>数学变换</strong>成只依赖中间激活 + 上游梯度的形式，消除反向对前向 <code>output</code> 的依赖；group GEMM 反向<strong>重算 dispatch</strong> 恢复输入（通信可与反向 overlap）</li>
<li><strong>Memory-efficient AttnRes</strong>：block 表示在边界层生成一次、后续层共享、常驻 GPU；AttnRes 全部 checkpointing 包裹 → <strong>每层保存的激活与标准残差相同</strong>；PP 用 cache-based 通信只增量传新 block</li>
</ul>
</section>

<h2 id="%E6%98%BE%E5%AD%98%E9%AB%98%E6%95%88%E8%AE%AD%E7%BB%83-%E2%91%A1">显存高效训练 ②</h2>
<ul>
<li><strong>跨 PP rank 均衡激活</strong>：interleaved 1F1B 下激活分布不均（越靠后 rank 常驻越少）→ 用 <strong>Mooncake Transfer Engine</strong> 把激活 remote-offload 到其他 PP rank 内存 → 均衡、防 OOM</li>
<li><strong>Pipeline ZeRO-2 梯度分片 + offload</strong>：梯度按 DP rank 分片，分片梯度存 <strong>CPU 内存</strong>降 GPU 峰值，double grad buffer 留 GPU</li>
<li><strong>P2P-based Muon 正交化</strong>：
<ul>
<li>Newton–Schulz 需<strong>完整参数矩阵</strong>，但分布式优化器把参数分片了 → 需先 gather</li>
<li>朴素全参 all-gather = 显存 + 通信双瓶颈</li>
<li><strong>K3：每 rank 只 P2P 取回自己负责参数的分片</strong>（向 owner rank 点对点）→ 消掉全参 buffer、降显存与通信；按 model-chunk buffer 粒度把通信与计算流水隐藏</li>
</ul>
</li>
</ul>
</section>

<h2 id="%E5%A4%9A%E6%A8%A1%E6%80%81%E7%BC%96%E7%A0%81%E5%99%A8%E4%BC%98%E5%8C%96%E9%80%9F%E8%A7%88">多模态编码器优化（速览）</h2>
<ul>
<li><strong>Dynamic CP</strong>：大图沿 patch 维切到多设备、gather-KV 算注意力；每个 CP 组再分若干 sub-CP 组、多张大图<strong>负载均衡</strong>分配 → 通信占比不随规模增长</li>
<li><strong>Bubble filling</strong>：延续 K2.5 的 Decoupled Encoder Process，进一步分解 ViT 计算
<ul>
<li>首批 micro-batch 的 ViT 前向同步先算，其余塞进<strong>流水气泡</strong>，反向同理</li>
<li>→ ViT 计算几乎全被气泡吸收，<strong>视觉编码器有效开销基本消除</strong></li>
</ul>
</li>
</ul>
<blockquote>
<p>呼应总纲：多模态 3T 的三难题（不均 / 超显存 / ViT 关键路径）被 MoonEP / 激活管理 / bubble filling 分别接管。</p>

<h2 id="rl-%E5%85%A8%E6%99%AF%E4%B8%89%E9%98%B6%E6%AE%B5--9-%E4%B8%AA%E4%B8%93%E5%AE%B6">RL 全景：三阶段 + 9 个专家</h2>
<p><strong>SFT（冷启动）→ 按域×effort 做 RL 得 9 个专家 → MOPD 多教师蒸馏合并为单模型</strong></p>
<ul>
<li><strong>RL 三大域</strong> × <strong>{low, high, max}</strong> = <strong>9 个专家</strong>：general / general agents / coding agents</li>
<li>scaling RL FLOPs → tool-call 步数与整体能力<strong>一致提升</strong></li>
<li><strong>算法：部分 rollout（partial rollout）</strong>
<ul>
<li>采样 N prompts × K completions；λ 比例轨迹完成就<strong>暂停生成</strong>、让策略优化先走（避免 straggler 长尾）</li>
<li>长轨迹跨多迭代 → 数据 <strong>staleness</strong> → 靠<strong>逐 token 正则</strong>把更新限制在局部邻域，容忍极端 off-policy</li>
</ul>
</li>
<li><strong>Reasoning-effort RL</strong>：每题给 token 预算，超预算给 −1；按 τ 从大到小课程得 max/high/low</li>
<li><strong>Agentic GRM</strong>：锦标赛式二元比较 + rubric 强制协议 + verbosity 预算防 reward hacking</li>
</ul>

<h3 id="mopd%E5%A4%9A%E6%95%99%E5%B8%88-on-policy-%E8%92%B8%E9%A6%8F">MOPD（多教师 on-policy 蒸馏）</h3>
<p>按域 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi></mrow><annotation encoding="application/x-tex">d</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">d</span></span></span></span> 与 effort <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>e</mi></mrow><annotation encoding="application/x-tex">e</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">e</span></span></span></span> 用对应教师，逐 token 稠密奖励：</p>

<div class="col">
<h3 id="%E9%83%A8%E7%BD%B2%E6%84%9F%E7%9F%A5">部署感知</h3>
<ul>
<li><strong>Draft / EAGLE-3</strong>：把预训练 MTP 层微调成 draft；输入融合第 1/4/末 AttnRes block 的低/中/高层特征</li>
<li><strong>LK loss</strong>：直接优化投机解码<strong>接受率</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi>log</mi><mo>⁡</mo><mo>∑</mo><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>p</mi><mo separator="true">,</mo><mi>q</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">-\log\sum\min(p,q)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">−</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord mathnormal">p</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="mclose">)</span></span></span></span> 而非 KL 代理</li>
<li>draft 训练也在 QAT 配置下</li>
</ul>
</div>
</div>
<p><span class="small">RL 环境：统一 white-box harness（防对单一 harness 过拟合）· 知识图谱引导任务合成 · kernel 优化（含防 reward-hacking）· AET 自主执行 · personal assistant mock · web dev</span></p>

<h2 id="%E6%8E%A8%E7%90%86--serving-infra%E8%A1%A5%E5%85%85%E9%80%9F%E8%A7%88">推理 &amp; Serving Infra（补充速览）</h2>
<ul>
<li><strong>KDA-aware prefix cache</strong>：MLA KV（随长度增长）与 KDA 递归态（固定大小）生命周期完全不同，但前缀<strong>只有两者同边界一起恢复</strong>才可复用
<ul>
<li>统一分页块池 + 解耦&quot;哈希粒度 vs 物理块粒度&quot; → 可在 512-token 边界命中、深入大物理块内部</li>
<li>并发一致性：命中块跨组 pin、checkpoint 原子失效</li>
</ul>
</li>
<li><strong>专用 kernel</strong>：KDA 解码（只缓存投影输入、片上重建状态，解决 MTP 拒绝无法回滚）· Block AttnRes 两阶段 · LatentMoE（下投影+router 融合、WarpDecode）</li>
<li><strong>Fleet 级调度</strong>：cache-aware affinity（一致性哈希 pin 主+备集群）· budget-based admission（按请求类分预算，防长请求拖垮短请求 TTFT）</li>
</ul>
</section>

<h2 id="%E6%94%B6%E5%B0%BE%E4%BA%94%E6%9D%A1%E6%96%B9%E6%B3%95%E8%AE%BA%E5%90%AF%E7%A4%BA">收尾：五条方法论启示</h2>
<ol>
<li><strong>算法-系统协同是主线</strong>：给 KDA 门&quot;加下界&quot;→ 对角块上 Tensor Core；MoonEP &quot;完美均衡&quot; → 静态 shape + 零拷贝 + 免同步。<strong>改算法时先想它对 kernel/通信/显存意味着什么。</strong></li>
<li><strong>把成熟维度的思想迁到新维度</strong>：attention 从序列维迁到深度维（AttnRes）；CP 从 softmax 迁到线性注意力（KCP：转移矩阵分解 + 前缀扫描）。</li>
<li><strong>有界化 / 归一化 = 极端稀疏 + 低精度下的稳定器</strong>：SiTU-GLU 有界 · LatentMoE 加 RMSNorm · KDA 门下界 · per-head 正交化。</li>
<li><strong>比较训练技巧要&quot;各自调到最优再比&quot;</strong>（cosine vs WSD 的教训）。</li>
<li><strong>负载均衡从&quot;启发式步长&quot;升级为&quot;有理论最优解的分位数&quot;</strong>（QB + 直方图全局估计）。</li>
</ol>
