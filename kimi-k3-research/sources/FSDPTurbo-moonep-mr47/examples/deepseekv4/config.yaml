# ============================================================
# DeepSeekV4 Training Configuration
# ============================================================

# --- Model Configuration ---
model:
  model_name_or_path: "deepseek-ai/DeepSeek-V4-Flash"
  tokenizer_name_or_path: "./tokenizer/"
  torch_dtype: "bf16"

# --- Optimizer Configuration ---
optimizer:
  optimizer_type: "AdamW"
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  lr: 3.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "CosineAnnealingLR"
  min_lr: 3.0e-5
  clip_grad: 1.0

# --- Run Configuration ---
run:
  seed: 42
  deterministic: true
  max_steps: -1
  num_train_epochs: 1
  gradient_accumulation_steps: 1
  logging_steps: 1
  profile:
    enabled: false
    wait_steps: 0
    warmup_steps: 0
    active_steps: 1
    repeat: 1
    skip_first: 0
    output_dir: "./profile"
    record_shapes: false
    profile_memory: false
    with_stack: false

# --- Checkpoint Configuration ---
checkpoint:
  output_dir: "./output"
  save_steps: 500
  strict: true
  save_optim: true
  load_optim: true
  resume_from_checkpoint: null

# --- Data Configuration ---
data:
  dataset_path: "Salesforce/wikitext"
  dataset_config: "wikitext-2-raw-v1"
  text_column: "text"
  split: "train"
  batch_size: 1
  max_seq_length: 1024
  num_workers: 8
  pin_memory: true
  shuffle: false

# --- Distributed Configuration ---
distributed:
  data_parallel_size: 1
  fully_shard_parallel_size: 8
  tensor_parallel_size: 1
  kv_allgather_parallel_size: 2
  ulysses_parallel_size: 2
  expert_parallel_size: 4
  expert_fully_shard_parallel_size: 1
  expert_data_parallel_size: 1

  # --- FSDP Plan ---
  fsdp_plan:
    ignored_modules: []
    apply_modules:
      model.layers.{*}:
        {}
      model.embed_tokens:
        {}
      lm_head:
        {}
    param_dtype: "bf16"
    reduce_dtype: "fp32"
    output_dtype: "bf16"
    cast_forward_inputs: true
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
    hook_modules:
      - model.layers.{*}
    fsdp_implementation: "native"

  # --- Tensor Parallel Plan ---
  tp_plan:
    colwise_parallel: []
    rowwise_parallel: []
    sequence_parallel: []

  # --- Expert Parallel Plan ---
  ep_plan:
    apply_modules:
      - model.layers.{*}.mlp.experts
    dispatcher: "fused"
    apply_efsdp_modules:
      - model.layers.{*}.mlp

  cp_plan:
    ulysses_core_attention_function: "transformers.models.deepseek_v4.modeling_deepseek_v4.eager_attention_forward"
    ulysses_attention_type: "with_compressor"
    ulysses_attn_output_transposed: true
    kv_allgather_core_attention_function: "transformers.models.deepseek_v4.modeling_deepseek_v4.eager_attention_forward"
    kv_allgather_attention_type: "with_compressor"

# --- Memory Configuration ---
memory:
  recompute: true
  recompute_plan:
    - model.layers.{*}

# --- Quantization Configuration ---
quantization:
  quantization_plan: null
